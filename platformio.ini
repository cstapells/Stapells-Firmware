[platformio]
default_envs = esp8266-d1-mini
src_dir = src
test_dir = test

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
  adafruit/Adafruit NeoPixel@^1.15.5
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  adafruit/Adafruit PCF8574@^1.1.2
  bblanchon/ArduinoJson@^7.4.3
  knolleary/PubSubClient@^2.8
build_flags =
  -D STAPELLS_FIRMWARE_NAME=\"base\"
  -D STAPELLS_FIRMWARE_VERSION=\"0.2.0-dev\"

[env:esp8266-d1-mini]
platform = espressif8266
board = d1_mini

[env:esp32]
platform = espressif32
board = esp32dev

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1

